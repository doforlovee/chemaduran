<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eeeae2">
  <meta name="description" content="Selección de videos editados por Chema Durán.">
  <title>Videos — Chema Durán</title>
  <style>
    :root{--paper:#eeeae2;--ink:#171717;--accent:#1877f2;--mono:'Courier New',monospace;--display:Impact,'Arial Narrow','Arial Black',sans-serif}
    *{box-sizing:border-box}
    body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,sans-serif}
    a,button{color:inherit}
    a:focus-visible,button:focus-visible,video:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
    .head,.foot{padding:16px clamp(18px,4vw,60px);display:flex;align-items:center;justify-content:space-between;gap:16px}
    .head{border-bottom:2px solid}
    .mark{font:900 40px var(--display);text-decoration:none}
    .mark span,h1 span{color:var(--accent)}
    .nav{display:flex;align-items:center;gap:clamp(10px,3vw,26px);font:700 12px var(--mono)}
    .nav button{border:1px solid;background:none;padding:9px;cursor:pointer;font:inherit}
    main{max-width:1500px;margin:auto;padding:clamp(30px,6vw,80px) clamp(18px,4vw,60px)}
    .eyebrow,.part{font:700 12px var(--mono);text-transform:uppercase;letter-spacing:.06em}
    h1{font:900 clamp(68px,14vw,184px)/.88 var(--display);letter-spacing:-.035em;margin:14px 0 36px}
    section{border-top:2px solid;padding-top:22px}
    section+section{margin-top:48px}
    h2{font:900 clamp(28px,5vw,58px)/1 var(--display);margin:0 0 14px}
    .intro{font:400 15px/1.5 var(--mono);margin:0 0 24px;max-width:65ch}
    .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
    figure{margin:0;min-width:0}
    .featured{max-width:380px}
    video{display:block;width:100%;aspect-ratio:9/16;background:#171717;object-fit:contain}
    .landscape{aspect-ratio:1276/720}
    figcaption{padding:12px 0;border-bottom:1px solid #aaa398}
    .foot{border-top:2px solid;font:700 11px var(--mono)}
    @media(max-width:640px){.grid{grid-template-columns:1fr;gap:24px}}
  </style>
</head>
<body>
  <header class="head">
    <a class="mark" href="index.html" aria-label="Chema Durán">JMD<span>.</span></a>
    <nav class="nav" aria-label="Portafolio">
      <a href="index.html#work" data-es="VOLVER A PROYECTOS" data-en="BACK TO PROJECTS">VOLVER A PROYECTOS</a>
      <button id="lang" type="button" lang="en">ENGLISH</button>
    </nav>
  </header>
  <main>
    <span class="eyebrow" data-es="Edición audiovisual" data-en="Video editing">Edición audiovisual</span>
    <h1><b data-es="VIDEOS" data-en="VIDEOS">VIDEOS</b><span>.</span></h1>
    <section aria-labelledby="serie">
      <h2 id="serie" data-es="No todos los años empiezan en enero" data-en="Not every year starts in January">No todos los años empiezan en enero</h2>
      <p class="intro" data-es="Mi año nuevo empezó a finales de octubre de 2025." data-en="My new year started in late October 2025.">Mi año nuevo empezó a finales de octubre de 2025.</p>
      <div class="grid">
        <figure>
          <video class="landscape" controls playsinline preload="none" aria-labelledby="parte-1" poster="assets/videos/mi-ano-nuevo-1.jpg" src="assets/videos/mi-ano-nuevo-1.mp4"></video>
          <figcaption class="part" id="parte-1" data-es="Parte 1 de 3" data-en="Part 1 of 3">Parte 1 de 3</figcaption>
        </figure>
        <figure>
          <video class="landscape" controls playsinline preload="none" aria-labelledby="parte-2" poster="assets/videos/mi-ano-nuevo-2.jpg" src="assets/videos/mi-ano-nuevo-2.mp4"></video>
          <figcaption class="part" id="parte-2" data-es="Parte 2 de 3" data-en="Part 2 of 3">Parte 2 de 3</figcaption>
        </figure>
        <figure>
          <video controls playsinline preload="none" aria-labelledby="parte-3" poster="assets/videos/mi-ano-nuevo-3.jpg" src="assets/videos/mi-ano-nuevo-3.mp4"></video>
          <figcaption class="part" id="parte-3" data-es="Parte 3 de 3" data-en="Part 3 of 3">Parte 3 de 3</figcaption>
        </figure>
      </div>
    </section>
    <section aria-labelledby="edicion">
      <h2 id="edicion" data-es="Edición independiente" data-en="Independent edit">Edición independiente</h2>
      <figure class="featured">
        <video controls playsinline preload="none" aria-labelledby="edicion" poster="assets/videos/edicion-independiente.jpg" src="assets/videos/edicion-independiente.mp4"></video>
      </figure>
    </section>
  </main>
  <footer class="foot"><span>CHEMA DURÁN © 2026</span><a href="index.html#work" data-es="PORTAFOLIO" data-en="PORTFOLIO">PORTAFOLIO</a></footer>
  <script>
    const languageButton = document.querySelector('#lang');
    languageButton.addEventListener('click', () => {
      const language = document.documentElement.lang === 'es' ? 'en' : 'es';
      document.documentElement.lang = language;
      for (const element of document.querySelectorAll('[data-es][data-en]')) {
        element.textContent = element.dataset[language];
      }
      languageButton.lang = language === 'es' ? 'en' : 'es';
      languageButton.textContent = language === 'es' ? 'ENGLISH' : 'ESPAÑOL';
    });
    const videos = document.querySelectorAll('video');
    for (const video of videos) {
      video.addEventListener('play', () => {
        for (const other of videos) {
          if (other !== video && !other.paused) other.pause();
        }
      });
    }
  </script>
</body>
</html>
